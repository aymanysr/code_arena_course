# Only public entry. Terminates HTTPS/WSS, proxies APIs. No gameplay here.
events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  upstream core_svc { server core:3001; }
  upstream game_svc { server game:3002; }

  # Plain HTTP exists only to redirect to HTTPS.
  server {
    listen 80;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Service APIs (frontend 12 and judging 06 attach their own locations later).
    location /api/core/ { proxy_pass http://core_svc/; }
    location /api/game/ {
      proxy_pass http://game_svc/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }

    # The frontend's single game base URL serves both REST (/matches and
    # /lobby) and Socket.IO namespaces. Keep those paths on the same HTTPS
    # origin so namespace URLs such as /collab and /chat use WSS at /socket.io.
    location ~ ^/(matches|lobby)(/|$) {
      proxy_pass http://game_svc;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket / Socket.IO ingress (terminates WSS, proxies every namespace,
    # including Game-owned /chat, to the game service).
    location /socket.io/ {
      proxy_pass http://game_svc/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
  }
}
