# Wave-0 CI lane: workspace typecheck, unit tests, problem-bank validation.
# Compose boot is verified locally per ticket 01 (docker layer not in CI yet).
name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck --workspaces --if-present
      - run: npm test --workspaces --if-present
