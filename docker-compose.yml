# Single-host Code Arena stack.
# Boot: npm run certs (once, dev TLS) && cp .env.example .env && docker compose up --build
# Only Nginx is publicly exposed. The judge worker is private and owns the
# Docker socket; untrusted player containers run with --network none.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORE_DB_NAME: ${CORE_DB_NAME}
      CORE_DB_USER: ${CORE_DB_USER}
      CORE_DB_PASSWORD: ${CORE_DB_PASSWORD}
      GAME_DB_NAME: ${GAME_DB_NAME}
      GAME_DB_USER: ${GAME_DB_USER}
      GAME_DB_PASSWORD: ${GAME_DB_PASSWORD}
      CHAT_DB_NAME: ${CHAT_DB_NAME}
      CHAT_DB_USER: ${CHAT_DB_USER}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core:
    build:
      context: .
      dockerfile: services/core/Dockerfile
    environment:
      SERVICE_NAME: core
      PORT: ${CORE_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  judge-worker:
    build:
      context: .
      dockerfile: services/judge-worker/Dockerfile
    environment:
      JUDGE_WORKER_TOKEN: ${JUDGE_WORKER_TOKEN:?set JUDGE_WORKER_TOKEN in .env}
      JUDGE_WORKER_PORT: "3010"
      JUDGE_DOCKER_BIN: docker
      JUDGE_PYTHON_IMAGE: ${JUDGE_PYTHON_IMAGE:-python:3.12-slim}
      JUDGE_GCC_IMAGE: ${JUDGE_GCC_IMAGE:-gcc:14-bookworm}
      JUDGE_WORKER_CONCURRENCY: ${JUDGE_WORKER_CONCURRENCY:-2}
      JUDGE_WORKER_MAX_QUEUE: ${JUDGE_WORKER_MAX_QUEUE:-8}
      JUDGE_WORKER_QUEUE_TIMEOUT_MS: ${JUDGE_WORKER_QUEUE_TIMEOUT_MS:-30000}
      JUDGE_WORKER_JOB_TIMEOUT_MS: ${JUDGE_WORKER_JOB_TIMEOUT_MS:-900000}
    volumes:
      - type: bind
        source: ${JUDGE_DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
    networks:
      - judge-internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3010/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  game:
    build:
      context: .
      dockerfile: services/game/Dockerfile
    environment:
      SERVICE_NAME: game
      PORT: ${GAME_PORT}
      # Compose uses the internal worker. Local development keeps
      # JUDGE_BACKEND=container from .env.example.
      JUDGE_BACKEND: worker
      JUDGE_WORKER_URL: http://judge-worker:3010
      JUDGE_WORKER_TOKEN: ${JUDGE_WORKER_TOKEN:?set JUDGE_WORKER_TOKEN in .env}
      JUDGE_WORKER_TIMEOUT_MS: ${JUDGE_WORKER_TIMEOUT_MS:-930000}
      DEV_PRINCIPAL: ${DEV_PRINCIPAL:-false}
      RECONNECT_GRACE_MS: ${RECONNECT_GRACE_MS:-90000}
      # ponytail: game persists matches/submissions/reveals/collab via this
      # URL (ADR-0002 least-privilege game role). Without it the service
      # silently falls back to in-memory stores. Keep the password
      # URL-safe (no @ / : ? #) or percent-encode it here.
      DATABASE_URL: postgres://${GAME_DB_USER}:${GAME_DB_PASSWORD}@postgres:5432/${GAME_DB_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      judge-worker:
        condition: service_healthy
    networks:
      - default
      - judge-internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Deferred service boundary. First-release match chat is Game's /chat
  # Socket.IO namespace; this container remains boot/readiness scaffolding.
  chat:
    build:
      context: .
      dockerfile: services/chat/Dockerfile
    environment:
      SERVICE_NAME: chat
      PORT: ${CHAT_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3003/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      core:
        condition: service_healthy
      game:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:

networks:
  judge-internal:
    internal: true
