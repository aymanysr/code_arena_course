<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Match Recovery Prototype | Campus Puzzle Race</title>
  <!-- THROWAWAY LOGIC PROTOTYPE: Can a player distinguish an active match, re-authentication, role-filtered restoration, and an unrecoverable restart? -->
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      --bg: #07100d;
      --surface: #0d1a16;
      --surface-2: #13231e;
      --line: #315044;
      --ink: #e4efe9;
      --muted: #9ab1a6;
      --accent: #c8f36a;
      --accent-ink: #102008;
      --blue: #8dd8ff;
      --warning: #f6cb6f;
      --danger: #ff9a80;
      --focus: #ffffff;
      --safe: clamp(0.85rem, 3vw, 3rem);
    }

    * { box-sizing: border-box; }
    html { min-inline-size: 20rem; background: var(--bg); }
    body { min-block-size: 100dvh; margin: 0; background: var(--bg); color: var(--ink); }
    button, a { font: inherit; }
    button { cursor: pointer; }
    :where(a, button, [tabindex="-1"]):focus-visible { outline: 0.2rem solid var(--focus); outline-offset: 0.2rem; }

    .skip-link {
      position: fixed;
      z-index: 10;
      inset: 0.75rem auto auto 0.75rem;
      display: inline-flex;
      align-items: center;
      min-block-size: 3rem;
      padding-inline: 0.9rem;
      translate: 0 -180%;
      background: #ffffff;
      color: #101010;
      font-weight: 800;
    }
    .skip-link:focus { translate: 0; }
    .prototype-flag {
      inline-size: fit-content;
      margin-inline: auto;
      border-radius: 0 0 0.45rem 0.45rem;
      padding: 0.3rem 0.75rem;
      background: var(--warning);
      color: #221c08;
      font: 800 0.875rem/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .visually-hidden {
      position: absolute !important;
      clip-path: inset(50%) !important;
      overflow: hidden !important;
      inline-size: 1px !important;
      block-size: 1px !important;
      margin: -1px !important;
      padding: 0 !important;
      border: 0 !important;
      white-space: nowrap !important;
    }
    .eyebrow { margin: 0; color: var(--muted); font: 800 0.875rem/1.25 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.1em; text-transform: uppercase; }
    .mono, .num { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .num { font-variant-numeric: tabular-nums; }

    main { min-block-size: 100dvh; padding: 0 var(--safe) max(2rem, env(safe-area-inset-bottom)); }
    .shell { max-inline-size: 82rem; margin-inline: auto; }
    .topbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; align-items: end; padding-block: clamp(1.5rem, 5vw, 4rem) 1.25rem; border-block-end: 1px solid var(--line); }
    h1, h2, h3, p { overflow-wrap: anywhere; }
    h1 { max-inline-size: 17ch; margin: 0.25rem 0 0; font-size: clamp(2rem, 5vw, 4.6rem); line-height: 0.98; letter-spacing: -0.045em; }
    h2 { margin: 0; font-size: clamp(1.2rem, 2vw, 1.65rem); }
    h3 { margin: 0; font-size: 1rem; }
    .match-meta { display: grid; gap: 0.25rem; justify-items: end; color: var(--muted); text-align: end; }
    .match-meta strong { color: var(--ink); }
    .intro { max-inline-size: 72ch; margin: 1.15rem 0 1.4rem; color: var(--muted); line-height: 1.55; }

    .scenario-bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 1rem; align-items: center; margin-block-end: 1rem; padding: 0.8rem; border: 1px solid var(--line); background: var(--surface); }
    .scenario-buttons { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .control, .action-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-block-size: 3rem;
      min-inline-size: 3rem;
      border: 1px solid var(--line);
      border-radius: 0.38rem;
      padding: 0.65rem 0.85rem;
      background: transparent;
      color: var(--ink);
      font-weight: 800;
      text-decoration: none;
    }
    .control[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, var(--surface)); color: var(--accent); }
    .control.primary, .action-link.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
    .control:disabled { cursor: not-allowed; opacity: 0.55; }

    .recovery-decision { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(16rem, 0.75fr); gap: 1rem; margin-block-end: 1rem; }
    .panel { min-inline-size: 0; border: 1px solid var(--line); background: var(--surface); }
    .panel-head { padding: 1rem 1rem 0; }
    .panel-body { padding: 1rem; }
    .status-card { display: grid; gap: 1rem; min-block-size: 100%; padding: clamp(1.1rem, 3vw, 2rem); background: var(--surface-2); }
    .status-card .eyebrow { color: var(--accent); }
    .status-card h2 { font-size: clamp(1.65rem, 3.3vw, 2.6rem); }
    .status-card p { max-inline-size: 60ch; margin: 0; color: var(--muted); line-height: 1.55; }
    .state-label { display: inline-flex; inline-size: fit-content; align-items: center; min-block-size: 2rem; border-radius: 99rem; padding-inline: 0.75rem; background: #392f15; color: var(--warning); font: 800 0.875rem/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0.06em; text-transform: uppercase; }
    .state-label.restored { background: #1d3027; color: var(--accent); }
    .state-label.interrupted { background: #35231e; color: var(--danger); }
    .ownership-list { display: grid; gap: 0.75rem; margin: 0; }
    .ownership-list div { border-block-end: 1px solid var(--line); padding-block-end: 0.75rem; }
    .ownership-list div:last-child { border: 0; padding-block-end: 0; }
    .ownership-list dt { color: var(--muted); font-size: 0.875rem; }
    .ownership-list dd { margin: 0.2rem 0 0; font-weight: 750; line-height: 1.4; }

    .telemetry-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1rem; margin-block-end: 1rem; }
    .telemetry-value { display: block; margin-block-start: 0.5rem; font-size: clamp(1.5rem, 3vw, 2.3rem); font-weight: 850; letter-spacing: -0.04em; }
    .telemetry-copy { margin: 0.55rem 0 0; color: var(--muted); line-height: 1.45; }
    .slot-status { color: var(--blue); }
    .live { color: var(--accent); }
    .paused { color: var(--warning); }

    .protocol { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 1rem; margin-block-end: 1rem; }
    .protocol-step { border-inline-start: 0.25rem solid var(--blue); padding-inline-start: 0.85rem; }
    .protocol-step + .protocol-step { border-color: var(--accent); }
    .protocol-step p { margin: 0.45rem 0 0; color: var(--muted); line-height: 1.5; }
    .privacy-note { margin: 0; border-inline-start: 0.25rem solid var(--warning); padding: 0.75rem 0.9rem; background: color-mix(in srgb, var(--warning) 9%, transparent); color: var(--muted); line-height: 1.5; }
    .privacy-note strong { color: var(--ink); }
    .snapshot-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.75rem; }
    .snapshot-card { min-inline-size: 0; border: 1px solid var(--line); padding: 0.9rem; background: var(--surface-2); }
    .snapshot-card h3 { color: var(--blue); }
    .snapshot-card p { margin: 0.5rem 0 0; color: var(--muted); line-height: 1.45; }
    .snapshot-card strong { color: var(--ink); }
    .pending-copy { margin: 0; color: var(--muted); line-height: 1.5; }

    .bottom-actions { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-block: 1rem 0; }
    .footer-note { max-inline-size: 84ch; margin: 1.25rem 0 0; color: var(--muted); font-size: 0.88rem; line-height: 1.55; }

    dialog { inline-size: min(42rem, calc(100% - 2rem)); max-block-size: calc(100dvh - 2rem); border: 1px solid var(--line); border-radius: 0.5rem; background: var(--surface); color: var(--ink); padding: 0; }
    dialog::backdrop { background: rgb(0 0 0 / 0.72); }
    dialog form { display: grid; gap: 0.8rem; padding: 1rem; }
    dialog h2 { margin: 0; }
    dialog pre { max-block-size: 50dvh; margin: 0; overflow: auto; scrollbar-gutter: stable; overscroll-behavior: contain; border: 1px solid var(--line); background: #050a08; padding: 0.9rem; color: var(--blue); font: 0.875rem/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap; }
    .dialog-actions { display: flex; justify-content: flex-end; }
    .sr-status { position: fixed; inset: auto auto 0 0; }

    @media (max-width: 46rem) {
      .topbar, .scenario-bar, .recovery-decision, .telemetry-grid, .protocol, .snapshot-grid { grid-template-columns: 1fr; }
      .match-meta { justify-items: start; text-align: start; }
      .scenario-bar > .control { inline-size: 100%; }
      .scenario-buttons { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .scenario-buttons .control { inline-size: 100%; }
    }
    @media (prefers-contrast: more) { :root { --line: #86aa99; --muted: #cad7d0; } }
    @media (prefers-reduced-motion: no-preference) { .control, .action-link { transition: background-color 140ms ease, border-color 140ms ease; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">Skip to recovery details</a>
  <div class="prototype-flag">Prototype · fake state</div>
  <main id="content" tabindex="-1">
    <div id="app"></div>
  </main>
  <p class="visually-hidden sr-status" id="live-status" aria-live="polite" aria-atomic="true"></p>

  <dialog id="state-dialog" aria-labelledby="state-title">
    <form method="dialog">
      <p class="eyebrow">Prototype inspector</p>
      <h2 id="state-title">Current fake recovery state</h2>
      <pre tabindex="0"><code id="state-output"></code></pre>
      <div class="dialog-actions"><button class="control" value="close">Close</button></div>
    </form>
  </dialog>

  <script>
    "use strict";

    // Pure scenario data and transition logic: no DOM, network, clock, authentication, or persistence dependency.
    const MATCH_ID = "MATCH-C42-014";
    const ROOM = "Campus lockdown";
    const scenarios = ["disconnected", "reconnecting", "restored", "interrupted"];

    function snapshot(scenario) {
      const common = {
        scenario,
        player: { name: "Saad", role: "Answer builder", connected: false, roleReserved: true },
        matchClock: { running: true, remainingSeconds: 428 },
        retryCooldown: { running: true, remainingSeconds: 12 },
        privateControls: { available: false, owner: "Saad" },
        snapshot: { authenticationRequired: false, filteredForRole: false, replayUnacknowledgedActions: false, roleSpecific: null, sharedProgress: null, chat: null, penalties: null },
        result: { status: "active", awardsWinOrLoss: false }
      };
      if (scenario === "disconnected") return {
        ...common,
        lastEvent: "Saad disconnected. The game service keeps the Match clock and role reservation active (simulated)."
      };
      if (scenario === "reconnecting") return {
        ...common,
        snapshot: { authenticationRequired: true, filteredForRole: false, replayUnacknowledgedActions: false, roleSpecific: null, sharedProgress: null, chat: null, penalties: null },
        lastEvent: "Reconnect requires Saad to authenticate again before the game service sends a role-filtered snapshot (simulated)."
      };
      if (scenario === "restored") return {
        ...common,
        player: { ...common.player, connected: true },
        privateControls: { available: true, owner: "Saad" },
        snapshot: {
          authenticationRequired: false,
          filteredForRole: true,
          replayUnacknowledgedActions: false,
          roleSpecific: { clueCards: ["Character-index map", "Stage 2 answer assembly"], controls: ["Assemble Team submission"] },
          sharedProgress: { currentStage: "Stage 2 · String indexing", completedStages: 1, totalStages: 3 },
          chat: { team: "Blue Team", latestMessage: "Mina: shared the index mapping." },
          penalties: { retryCooldownRemainingSeconds: 12, hintsUsed: 1, finishDelaySeconds: 30 }
        },
        lastEvent: "Saad authenticated and received a fresh role-specific snapshot with simulated Team progress, chat, and penalties."
      };
      return {
        ...common,
        matchClock: { running: false, remainingSeconds: 428 },
        retryCooldown: { running: false, remainingSeconds: 12 },
        result: { status: "interrupted", awardsWinOrLoss: false },
        lastEvent: "The game service restarted without a recoverable Match snapshot. No result was recorded (simulated)."
      };
    }

    function requestedScenario() {
      const candidate = new URLSearchParams(location.search).get("scenario");
      return scenarios.includes(candidate) ? candidate : "disconnected";
    }

    function nextRecoveryScenario(current) {
      if (current.scenario === "disconnected") return "reconnecting";
      if (current.scenario === "reconnecting") return "restored";
      return current.scenario;
    }

    let state = snapshot(requestedScenario());
    const app = document.querySelector("#app");
    const liveStatus = document.querySelector("#live-status");
    const stateDialog = document.querySelector("#state-dialog");
    const stateOutput = document.querySelector("#state-output");
    window.__RECOVERY_STATE__ = () => structuredClone(state);

    function formatSeconds(seconds) {
      return `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
    }

    function describeState(current) {
      if (current.scenario === "disconnected") return {
        label: "Disconnected · role held", className: "", title: "Saad's role is held while the Match continues", copy: "Saad is no longer connected, but the game service keeps the Match clock running and reserves the Answer builder Role. Teammates keep playing without taking over Saad's private controls."
      };
      if (current.scenario === "reconnecting") return {
        label: "Reconnecting · authenticate", className: "", title: "Verify identity before restoring a view", copy: "A reconnect is not a replay. Saad must authenticate again; only then can the game service provide a new snapshot filtered to Saad's Role. Unacknowledged actions are not replayed as new actions."
      };
      if (current.scenario === "restored") return {
        label: "Restored · snapshot returned", className: "restored", title: "Saad has a fresh role-filtered snapshot", copy: "Authentication completed and the game service restored Saad's Answer builder view together with shared Team progress, Team chat, and penalty state. The Match clock and Retry cooldown continued while Saad was away."
      };
      return {
        label: "Interrupted · no result", className: "interrupted", title: "No result recorded · Create a new match", copy: "This is an unrecoverable game-service restart path. The prototype does not invent a win or loss from an interrupted Match; players must create a new Match."
      };
    }

    function scenarioName(scenario) {
      return scenario[0].toUpperCase() + scenario.slice(1);
    }

    function snapshotContents(snapshot) {
      if (!snapshot.filteredForRole) return `<p class="pending-copy">Role-specific content, shared progress, Team chat, and penalties stay unavailable until reconnect authentication succeeds and a fresh snapshot is authorized.</p>`;
      return `<div class="snapshot-grid">
        <article class="snapshot-card"><h3>Role-specific clues</h3><p><strong>${snapshot.roleSpecific.clueCards.length} fake clue cards</strong><br>${snapshot.roleSpecific.controls.join(" · ")}</p></article>
        <article class="snapshot-card"><h3>Shared team progress</h3><p><strong>${snapshot.sharedProgress.currentStage}</strong><br>${snapshot.sharedProgress.completedStages}/${snapshot.sharedProgress.totalStages} Stages complete</p></article>
        <article class="snapshot-card"><h3>Team chat</h3><p><strong>${snapshot.chat.team}</strong><br>${snapshot.chat.latestMessage}</p></article>
        <article class="snapshot-card"><h3>Penalty state</h3><p><strong>${formatSeconds(snapshot.penalties.retryCooldownRemainingSeconds)} Retry cooldown</strong><br>${snapshot.penalties.hintsUsed} Hint · ${snapshot.penalties.finishDelaySeconds}s Finish delay</p></article>
      </div>`;
    }

    function chooseScenario(scenario) {
      const params = new URLSearchParams(location.search);
      params.set("scenario", scenario);
      history.pushState(null, "", `${location.pathname}?${params.toString()}`);
      state = snapshot(scenario);
      render({ focusSelector: `[data-scenario="${scenario}"]` });
    }

    function continueRecovery() {
      const next = nextRecoveryScenario(state);
      if (next === state.scenario) return;
      const params = new URLSearchParams(location.search);
      params.set("scenario", next);
      history.pushState(null, "", `${location.pathname}?${params.toString()}`);
      state = snapshot(next);
      render({ focusSelector: "#recovery-title" });
    }

    function render({ focusSelector } = {}) {
      const description = describeState(state);
      const recoveryControl = state.scenario === "disconnected" || state.scenario === "reconnecting"
        ? `<button class="control primary" type="button" data-action="continue-recovery">Continue recovery</button>`
        : "";
      const liveClock = state.matchClock.running ? "Running" : "Stopped by interruption";
      const cooldown = state.retryCooldown.running ? "Running" : "Stopped by interruption";
      app.innerHTML = `<div class="shell">
        <header class="topbar">
          <div><p class="eyebrow">Recovery console · ${ROOM}</p><h1>Match recovery: ${description.title}</h1></div>
          <div class="match-meta"><span class="eyebrow">Authoritative Match ID</span><strong class="mono">${MATCH_ID}</strong><span>Production transition owner: Game service</span></div>
        </header>
        <p class="intro">Question this throwaway prototype explores: can a player understand that an active Match continues through a disconnect, that reconnect authentication comes before role-filtered restoration, and that an unrecoverable restart cannot fabricate a result?</p>
        <nav class="scenario-bar" aria-label="Recovery scenarios">
          <div class="scenario-buttons">${scenarios.map((scenario) => `<button class="control" type="button" data-scenario="${scenario}" aria-pressed="${state.scenario === scenario}">${scenarioName(scenario)}</button>`).join("")}</div>
          <button class="control" type="button" id="show-state">Inspect state</button>
        </nav>
        <div class="recovery-decision">
          <section class="status-card" aria-labelledby="recovery-title"><p class="eyebrow">Recovery state</p><span class="state-label ${description.className}">${description.label}</span><h2 id="recovery-title" tabindex="-1">${description.title}</h2><p>${description.copy}</p>${recoveryControl}</section>
          <aside class="panel" aria-labelledby="ownership-title"><div class="panel-head"><p class="eyebrow">Ownership boundary</p><h2 id="ownership-title">What remains protected</h2></div><div class="panel-body"><dl class="ownership-list"><div><dt>Role reservation</dt><dd>Reserved for Saad</dd></div><div><dt>Private controls</dt><dd>${state.privateControls.available ? "Available only to Saad" : "Unavailable until Saad returns"}</dd></div><div><dt>Result authority</dt><dd>${state.result.awardsWinOrLoss ? "Not applicable" : "No win or loss is awarded here"}</dd></div></dl></div></aside>
        </div>
        <section class="telemetry-grid" aria-label="Match continuity details">
          <article class="panel"><div class="panel-head"><p class="eyebrow">Match clock</p><strong class="telemetry-value num ${state.matchClock.running ? "live" : "paused"}">${formatSeconds(state.matchClock.remainingSeconds)}</strong><p class="telemetry-copy">${liveClock}. The browser display is not authoritative.</p></div></article>
          <article class="panel"><div class="panel-head"><p class="eyebrow">Retry cooldown</p><strong class="telemetry-value num ${state.retryCooldown.running ? "live" : "paused"}">${formatSeconds(state.retryCooldown.remainingSeconds)}</strong><p class="telemetry-copy">${cooldown}. The Team can discuss but cannot submit during an active cooldown.</p></div></article>
          <article class="panel"><div class="panel-head"><p class="eyebrow">Saad · Answer builder</p><strong class="telemetry-value slot-status">${state.player.connected ? "Connected" : "Reserved"}</strong><p class="telemetry-copy">${state.player.roleReserved ? "The Role remains reserved; it is not reassigned." : "This scenario never releases the Role."}</p></div></article>
        </section>
        <section class="panel" aria-labelledby="protocol-title"><div class="panel-head"><p class="eyebrow">Reconnect protocol</p><h2 id="protocol-title">Authenticate, then restore a safe snapshot</h2></div><div class="panel-body"><div class="protocol"><article class="protocol-step"><h3>1. Reconnect authentication</h3><p>${state.snapshot.authenticationRequired ? "Required now: prove that this returning player is Saad." : "Not required in the current fake state."}</p></article><article class="protocol-step"><h3>2. Role-filtered snapshot</h3><p>${state.snapshot.filteredForRole ? "Restored: Saad's private Answer builder view plus shared Team progress, chat, and penalties are available." : "Not restored yet: a snapshot waits until authentication succeeds."}</p></article></div><p class="privacy-note"><strong>Private boundary:</strong> teammates do not inherit Saad's private clues or controls during a disconnect. ${state.snapshot.replayUnacknowledgedActions ? "This prototype never enables replay." : "Unacknowledged actions are not replayed as new actions."}</p></div></section>
        <section class="panel" aria-labelledby="snapshot-contents-title"><div class="panel-head"><p class="eyebrow">Simulated restoration payload</p><h2 id="snapshot-contents-title">${state.snapshot.filteredForRole ? "Restored snapshot contents" : "Snapshot contents pending"}</h2></div><div class="panel-body">${snapshotContents(state.snapshot)}</div></section>
        <nav class="bottom-actions" aria-label="Prototype navigation"><a class="action-link primary" href="index.html?variant=A">Open active Match</a><a class="action-link" href="outcomes.html">View outcome states</a><a class="action-link" href="journey.html">Open journey map</a>${state.scenario === "interrupted" ? `<a class="action-link" href="lobby.html?variant=A">Create a new match</a>` : ""}</nav>
        <p class="footer-note">Prototype scope only: this page contains fake in-memory state and fake restoration payloads. The game service would own real Match continuity and result transitions; Core would own real authentication; Chat would own real Team messages. Network latency, WebSocket behavior, authentication, snapshot filtering, persistence, and restart recovery remain production work and are not demonstrated here.</p>
      </div>`;
      document.title = `${description.title} Recovery Prototype | Campus Puzzle Race`;
      stateOutput.textContent = JSON.stringify(state, null, 2);
      liveStatus.textContent = state.lastEvent;
      if (focusSelector) app.querySelector(focusSelector)?.focus();
    }

    app.addEventListener("click", (event) => {
      const scenarioButton = event.target.closest("[data-scenario]");
      if (scenarioButton) chooseScenario(scenarioButton.dataset.scenario);
      if (event.target.closest("[data-action='continue-recovery']")) continueRecovery();
      if (event.target.closest("#show-state")) stateDialog.showModal();
    });

    window.addEventListener("popstate", () => {
      state = snapshot(requestedScenario());
      render();
    });

    render();
  </script>
</body>
</html>
