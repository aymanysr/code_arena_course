<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Account Access Prototype | Campus Puzzle Race</title>
  <!-- THROWAWAY PROTOTYPE: Can a player understand sign-up, sign-in, explicit 42 link, and OAuth outage fallback? -->
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --bg: #07100d; --surface: #0d1a16; --surface-2: #13231e;
      --line: #315044; --ink: #e4efe9; --muted: #9ab1a6;
      --accent: #c8f36a; --accent-ink: #102008;
      --blue: #8dd8ff; --warning: #f6cb6f; --focus: #ffffff;
      --safe: clamp(0.85rem, 3vw, 3rem);
    }
    * { box-sizing: border-box; }
    html { min-inline-size: 20rem; background: var(--bg); }
    body { min-block-size: 100dvh; margin: 0; background: var(--bg); color: var(--ink); font-size: 1rem; }
    button, a, input { font: inherit; }
    button { cursor: pointer; }
    :where(a, button, input, [tabindex="-1"]):focus-visible { outline: 0.2rem solid var(--focus); outline-offset: 0.2rem; }
    .skip-link { position: fixed; z-index: 10; inset: 0.75rem auto auto 0.75rem; display: inline-flex; align-items: center; min-block-size: 3rem; padding-inline: 0.9rem; translate: 0 -180%; background: #fff; color: #101010; font-weight: 800; }
    .skip-link:focus { translate: 0; }
    .prototype-flag { inline-size: fit-content; margin-inline: auto; border-radius: 0 0 0.45rem 0.45rem; padding: 0.3rem 0.75rem; background: var(--warning); color: #221c08; font: 800 0.875rem/1.2 ui-monospace, monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    .visually-hidden { position: absolute !important; clip-path: inset(50%) !important; overflow: hidden !important; inline-size: 1px !important; block-size: 1px !important; margin: -1px !important; padding: 0 !important; border: 0 !important; white-space: nowrap !important; }
    .eyebrow { margin: 0; color: var(--muted); font: 800 0.875rem/1.25 ui-monospace, monospace; letter-spacing: 0.1em; text-transform: uppercase; }
    main { min-block-size: 100dvh; padding: 0 var(--safe) 2rem; }
    .shell { max-inline-size: 62rem; margin-inline: auto; }
    .topbar { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 1rem; align-items: end; padding-block: clamp(1.5rem,5vw,3rem) 1.25rem; border-block-end: 1px solid var(--line); }
    h1 { margin: 0.25rem 0 0; font-size: clamp(2rem,5vw,3.8rem); letter-spacing: -0.04em; line-height: 1; }
    .intro { max-inline-size: 68ch; color: var(--muted); line-height: 1.55; }
    .scenario-bar { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 1rem; align-items: center; margin-block: 1rem; padding: 0.8rem; border: 1px solid var(--line); background: var(--surface); }
    .scenario-buttons { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .control, .action-link { display: inline-flex; align-items: center; justify-content: center; min-block-size: 3rem; min-inline-size: 3rem; border: 1px solid var(--line); border-radius: 0.38rem; padding: 0.65rem 0.85rem; background: transparent; color: var(--ink); font-weight: 800; text-decoration: none; }
    .control[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, var(--surface)); color: var(--accent); }
    .control.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
    .panel { border: 1px solid var(--line); background: var(--surface); margin-block-end: 1rem; }
    .panel-head { padding: 1rem 1rem 0; }
    .panel-body { padding: 1rem; display: grid; gap: 0.8rem; }
    h2 { margin: 0; font-size: 1.4rem; }
    label { display: grid; gap: 0.3rem; font-weight: 700; }
    input { min-block-size: 3rem; border: 1px solid var(--line); border-radius: 0.38rem; background: #050a08; color: var(--ink); padding: 0.65rem 0.8rem; }
    .hint { margin: 0; color: var(--muted); font-size: 0.9375rem; line-height: 1.5; }
    .error { border-inline-start: 0.25rem solid var(--warning); padding: 0.6rem 0.8rem; background: color-mix(in srgb, var(--warning) 9%, transparent); color: var(--ink); }
    .rule-note { border-inline-start: 0.25rem solid var(--blue); padding: 0.75rem 0.9rem; background: color-mix(in srgb, var(--blue) 8%, transparent); color: var(--muted); line-height: 1.5; }
    .bottom-actions { display: flex; flex-wrap: wrap; gap: 0.65rem; margin-block: 1rem 0; }
    footer { color: var(--muted); font-size: 0.875rem; line-height: 1.55; }
    footer nav { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; margin-block-end: 0.6rem; }
    footer nav a { display: inline-flex; align-items: center; min-block-size: 3rem; }
    dialog { inline-size: min(42rem, calc(100% - 2rem)); border: 1px solid var(--line); border-radius: 0.5rem; background: var(--surface); color: var(--ink); padding: 0; }
    dialog::backdrop { background: rgb(0 0 0 / 0.72); }
    dialog form { display: grid; gap: 0.8rem; padding: 1rem; }
    dialog pre { max-block-size: 50dvh; overflow: auto; background: #050a08; border: 1px solid var(--line); padding: 0.9rem; white-space: pre-wrap; font-size: 0.875rem; }
    @media (max-width: 46rem) { .topbar, .scenario-bar { grid-template-columns: 1fr; } .scenario-buttons { display: grid; grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <a class="skip-link" href="#content">Skip to account details</a>
  <div class="prototype-flag">Prototype · fake state</div>
  <main id="content" tabindex="-1"><div id="app"></div></main>
  <p class="visually-hidden" id="live-status" aria-live="polite" aria-atomic="true"></p>
  <dialog id="state-dialog" aria-labelledby="state-title">
    <form method="dialog">
      <p class="eyebrow">Prototype inspector</p>
      <h2 id="state-title">Current fake account state</h2>
      <pre tabindex="0"><code id="state-output"></code></pre>
      <div><button class="control" value="close">Close</button></div>
    </form>
  </dialog>
  <script>
    "use strict";
    const scenarios = ["signup", "signin", "link", "login42", "outage"];
    function snapshot(scenario) {
      const base = { scenario, email: "aimane@example.com", linked42: false, outage42: false, lastEvent: "" };
      if (scenario === "signup") return { ...base, lastEvent: "New player can create an account with email and password (simulated)." };
      if (scenario === "signin") return { ...base, lastEvent: "Returning player can sign in with email and password (simulated)." };
      if (scenario === "link") return { ...base, linked42: true, lastEvent: "Signed-in player linked a 42 identity with explicit confirm (simulated)." };
      if (scenario === "login42") return { ...base, linked42: true, lastEvent: "Player with a linked 42 identity can sign in via 42 (simulated)." };
      return { ...base, outage42: true, lastEvent: "42 sign-in is down. Email and password sign-in still works (simulated)." };
    }
    function requestedScenario() {
      const c = new URLSearchParams(location.search).get("scenario");
      return scenarios.includes(c) ? c : "signup";
    }
    let state = snapshot(requestedScenario());
    const app = document.querySelector("#app");
    const liveStatus = document.querySelector("#live-status");
    const stateDialog = document.querySelector("#state-dialog");
    const stateOutput = document.querySelector("#state-output");
    window.__ACCOUNT_STATE__ = () => structuredClone(state);

    function describe(s) {
      if (s === "signup") return { title: "Create your account", copy: "Use email and password. The Core service checks the input again on the server." };
      if (s === "signin") return { title: "Sign in with email", copy: "Use your email and password. This path works even when 42 is down." };
      if (s === "link") return { title: "Link your 42 identity", copy: "You are signed in. Link 42 with explicit confirm. Same email alone never links accounts." };
      if (s === "login42") return { title: "Sign in with 42", copy: "This works only after you linked 42 while signed in. An unlinked 42 sign-in goes to register or sign-in first." };
      return { title: "42 is down — use email", copy: "OAuth outage path. Email and password stay usable. The page shows a clear error for 42 only." };
    }
    function render(opts = {}) {
      const d = describe(state.scenario);
      app.innerHTML = `<div class="shell">
        <header class="topbar">
          <div><p class="eyebrow">Account access · Core service owns this step</p><h1>${d.title}</h1></div>
          <div><span class="eyebrow">Fake match ref</span><br><strong>MATCH-C42-014</strong></div>
        </header>
        <p class="intro">Question this test view explores: can a player tell email sign-up apart from 42 link, and still sign in when 42 is down? ${d.copy}</p>
        <nav class="scenario-bar" aria-label="Account scenarios">
          <div class="scenario-buttons">${scenarios.map(s => `<button class="control" type="button" data-scenario="${s}" aria-pressed="${state.scenario === s}">${s}</button>`).join("")}</div>
          <button class="control" type="button" id="show-state">Inspect state</button>
        </nav>
        <section class="panel" aria-labelledby="form-title">
          <div class="panel-head"><p class="eyebrow">Email and password</p><h2 id="form-title">Secure entry (front-end check only)</h2></div>
          <div class="panel-body">
            <form id="auth-form" novalidate>
              <label>Email<input name="email" type="email" required autocomplete="email" value="${state.email}"></label>
              <label>Password<input name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="8+ characters"></label>
              <p class="hint">Front-end check is for speed only. The Core service is the authority. Passwords are hashed with salt in production.</p>
              <div><button class="control primary" type="submit">Continue with email</button></div>
            </form>
            ${state.outage42 ? `<p class="error"><strong>42 sign-in unavailable.</strong> Use email and password. No data was lost.</p>` : ""}
            <div class="rule-note"><strong>Link rule:</strong> link 42 only while signed in, with explicit confirm. Same email alone never links. Unlinked 42 sign-in directs you to register or sign in first.</div>
            <div>
              <button class="control" type="button" data-action="link42" ${state.outage42 ? "disabled" : ""}>${state.linked42 ? "42 linked ✓ (simulated)" : "Link 42 / Sign in with 42"}</button>
            </div>
          </div>
        </section>
        <div class="bottom-actions">
          <a class="action-link" href="08-policies.html">Read policies before you join</a>
          <a class="action-link" href="02-home.html">Continue to Home (test view)</a>
          <a class="action-link" href="00-journey.html">Open journey map</a>
        </div>
        <footer><nav aria-label="Policy links"><a href="08-policies.html?doc=privacy">Privacy Policy</a><a href="08-policies.html?doc=terms">Terms of Service</a></nav>Test view only. No network, no database, no real auth. Production needs HTTPS, secure cookies, server validation, and signed tokens.</footer>
      </div>`;
      stateOutput.textContent = JSON.stringify(state, null, 2);
      liveStatus.textContent = state.lastEvent;
      if (opts.focusSelector) app.querySelector(opts.focusSelector)?.focus();
    }
    function choose(s) {
      const p = new URLSearchParams(location.search);
      p.set("scenario", s);
      history.pushState(null, "", `${location.pathname}?${p.toString()}`);
      state = snapshot(s);
      render({ focusSelector: `[data-scenario="${s}"]` });
    }
    app.addEventListener("click", (e) => {
      const b = e.target.closest("[data-scenario]");
      if (b) { choose(b.dataset.scenario); return; }
      if (e.target.closest("#show-state")) stateDialog.showModal();
      if (e.target.closest('[data-action="link42"]')) {
        state.linked42 = true;
        state.lastEvent = "42 link confirmed by signed-in player (simulated).";
        render(); return;
      }
    });
    app.addEventListener("submit", (e) => {
      if (!e.target.closest("#auth-form")) return;
      e.preventDefault();
      const fd = new FormData(e.target);
      const email = String(fd.get("email") || "");
      const pw = String(fd.get("password") || "");
      if (!email.includes("@") || pw.length < 8) {
        state.lastEvent = "Front-end check blocked the submit. Fix email and 8+ character password.";
      } else {
        state.lastEvent = `Email check passed for ${email} (simulated). Server check still required.`;
      }
      render();
    });
    addEventListener("popstate", () => { state = snapshot(requestedScenario()); render(); });
    render();
  </script>
</body>
</html>
