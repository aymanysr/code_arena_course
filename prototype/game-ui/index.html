<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Active Match UI Prototype | Campus Puzzle Race</title>
  <!-- UI spike: Which information hierarchy makes a role-based multiplayer puzzle easiest to understand during a timed match? Three variants, switchable with ?variant=A|B|C. -->
  <style>
    :root {
      color-scheme: dark;
      --safe: clamp(0.75rem, 3.5vw, 3.5rem);
      --switcher-height: 5.2rem;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
    }

    * { box-sizing: border-box; }

    html { min-width: 20rem; background: #080b0a; }

    body {
      min-height: 100dvh;
      margin: 0;
      overflow-x: hidden;
    }

    button,
    input,
    textarea { font: inherit; }

    small { font-size: 0.875rem; }

    button { cursor: pointer; }

    :where(button, input, textarea, summary):focus-visible {
      outline: 0.2rem solid var(--focus, #ffffff);
      outline-offset: 0.18rem;
    }

    .skip-link {
      position: fixed;
      z-index: 100;
      inset: 0.75rem auto auto 0.75rem;
      display: inline-flex;
      align-items: center;
      min-height: 3rem;
      translate: 0 -180%;
      padding: 0.7rem 1rem;
      background: #ffffff;
      color: #111111;
      font-weight: 800;
    }

    .skip-link:focus { translate: 0; }

    .prototype-flag {
      position: fixed;
      z-index: 20;
      inset: 0 auto auto 50%;
      translate: -50% 0;
      border: 0;
      border-radius: 0 0 0.45rem 0.45rem;
      background: #f5d85a;
      color: #15130b;
      padding: 0.3rem 0.7rem;
      font: 800 0.875rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #app { min-height: 100dvh; }

    .visually-hidden:where(:not(:focus-within, :active)) {
      position: absolute !important;
      width: 1px !important;
      height: 1px !important;
      margin: -1px !important;
      overflow: hidden !important;
      clip-path: inset(50%) !important;
      white-space: nowrap !important;
      border: 0 !important;
      padding: 0 !important;
    }

    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .num { font-variant-numeric: tabular-nums; }

    .eyebrow {
      margin: 0;
      font: 800 0.875rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .status-dot {
      display: inline-block;
      width: 0.55rem;
      height: 0.55rem;
      border-radius: 50%;
      background: currentColor;
      margin-inline-end: 0.38rem;
    }

    .sr-status {
      position: fixed;
      inset: auto auto 0 0;
    }

    /* Shared controls */
    .answer-list {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.55rem;
    }

    .answer-btn {
      min-height: 3.25rem;
      border: 1px solid currentColor;
      border-radius: 0.4rem;
      background: transparent;
      color: inherit;
      font-weight: 850;
    }

    .answer-btn[aria-pressed="true"] {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }

    .action-btn {
      min-height: 3rem;
      border: 1px solid currentColor;
      border-radius: 0.4rem;
      background: transparent;
      color: inherit;
      padding: 0.65rem 0.9rem;
      font-weight: 780;
    }

    .action-btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: var(--accent-ink);
    }

    .action-btn:disabled {
      cursor: not-allowed;
      opacity: 0.47;
    }

    .code-block {
      overflow: auto;
      margin: 0;
      border-radius: 0.45rem;
      padding: clamp(0.9rem, 2vw, 1.5rem);
      font: 650 clamp(0.875rem, 1.5vw, 1rem)/1.75 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre;
    }

    .code-block code { font: inherit; }

    .token-key { color: var(--code-key); }
    .token-num { color: var(--code-num); }
    .token-comment { color: var(--code-comment); }

    .role-list,
    .stage-list,
    .chat-list,
    .clue-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .chat-list {
      display: grid;
      gap: 0.6rem;
      max-height: 13rem;
      overflow: auto;
      scrollbar-width: thin;
    }

    .chat-message {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem;
      align-items: start;
      font-size: 0.875rem;
    }

    .chat-message strong { white-space: nowrap; }

    .chat-form {
      display: flex;
      gap: 0.5rem;
      margin-block-start: 0.75rem;
    }

    .chat-form input {
      min-width: 0;
      flex: 1;
      min-height: 2.75rem;
      border: 1px solid currentColor;
      border-radius: 0.35rem;
      background: transparent;
      color: inherit;
      padding: 0.55rem 0.7rem;
    }

    .chat-form button {
      min-width: 2.9rem;
      border: 1px solid currentColor;
      border-radius: 0.35rem;
      background: transparent;
      color: inherit;
      font-weight: 900;
    }

    .progress-track {
      height: 0.42rem;
      overflow: hidden;
      border-radius: 99rem;
      background: color-mix(in srgb, currentColor 18%, transparent);
    }

    .progress-fill {
      width: var(--progress);
      height: 100%;
      background: var(--accent);
    }

    .stack-actions {
      display: grid;
      gap: 0.55rem;
    }

    .match-alert {
      border-inline-start: 0.25rem solid var(--alert);
      padding: 0.65rem 0.8rem;
      background: color-mix(in srgb, var(--alert) 11%, transparent);
      font-size: 0.875rem;
    }

    /* Variant A — operations console */
    .variant-a {
      --bg: #07100d;
      --surface: #0d1a16;
      --surface-2: #13231e;
      --line: #315044;
      --ink: #e4efe9;
      --muted: #8da69b;
      --accent: #c8f36a;
      --accent-ink: #102008;
      --alert: #ff866c;
      --focus: #ffffff;
      --code-key: #8dd8ff;
      --code-num: #f6cb6f;
      --code-comment: #7d988d;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      padding: max(2.4rem, var(--safe)) var(--safe) calc(var(--switcher-height) + 1.5rem);
    }

    .a-shell {
      display: grid;
      grid-template-rows: auto auto minmax(32rem, 1fr);
      gap: 0.75rem;
      width: min(105rem, 100%);
      min-height: calc(100dvh - var(--switcher-height) - 4rem);
      margin-inline: auto;
    }

    .a-topbar {
      display: grid;
      grid-template-columns: minmax(15rem, 1fr) auto minmax(15rem, 1fr);
      align-items: center;
      border-block: 1px solid var(--line);
      padding-block: 0.75rem;
    }

    .a-topbar h1 {
      margin: 0.2rem 0 0;
      font-size: clamp(1rem, 2vw, 1.35rem);
    }

    .journey-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 3rem;
      margin-block-start: 0.65rem;
      border: 1px solid var(--accent);
      border-radius: 0.4rem;
      padding: 0.65rem 0.85rem;
      color: var(--accent);
      font-weight: 800;
      text-decoration: none;
    }

    .journey-link:hover { background: color-mix(in srgb, var(--accent) 15%, transparent); }

    .a-timer {
      min-width: 8.5rem;
      text-align: center;
    }

    .a-timer strong {
      display: block;
      color: var(--accent);
      font: 850 clamp(1.8rem, 4vw, 3.1rem)/0.95 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .a-opponent { text-align: end; }

    .a-stagebar {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      border: 1px solid var(--line);
    }

    .a-stage {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.65rem;
      align-items: center;
      padding: 0.65rem 0.8rem;
      color: var(--muted);
    }

    .a-stage + .a-stage { border-inline-start: 1px solid var(--line); }
    .a-stage.active { background: var(--surface-2); color: var(--ink); }
    .a-stage-index { color: var(--accent); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 900; }

    .a-grid {
      display: grid;
      grid-template-columns: minmax(13rem, 0.72fr) minmax(28rem, 2fr) minmax(16rem, 0.9fr);
      border: 1px solid var(--line);
      background: var(--surface);
    }

    .a-pane { min-width: 0; padding: clamp(0.8rem, 1.5vw, 1.2rem); }
    .a-pane + .a-pane { border-inline-start: 1px solid var(--line); }
    .a-pane h2 { margin: 0.3rem 0 1rem; font-size: 1rem; }

    .a-role-card {
      border: 1px solid var(--line);
      padding: 0.8rem;
      background: var(--surface-2);
    }

    .a-role-card strong { display: block; margin-block: 0.2rem 0.55rem; font-size: 1.15rem; }
    .a-role-card p { margin: 0; color: var(--muted); font-size: 0.875rem; }

    .a-clue {
      border-block-end: 1px solid var(--line);
      padding-block: 0.8rem;
    }

    .a-clue small { display: block; color: var(--muted); }
    .a-clue p { margin: 0.35rem 0 0; font-size: 0.9rem; }

    .a-workspace {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 1rem;
    }

    .a-prompt h2 { margin-block-end: 0.25rem; font-size: clamp(1.25rem, 2.4vw, 2rem); }
    .a-prompt p { margin: 0; color: var(--muted); }
    .variant-a .code-block { border: 1px solid var(--line); background: #050a08; }

    .a-response { display: grid; gap: 0.75rem; }
    .a-response-head { display: flex; justify-content: space-between; gap: 1rem; align-items: end; }
    .a-response-head p { margin: 0; color: var(--muted); font-size: 0.875rem; }
    .a-action-row { display: grid; grid-template-columns: 1fr auto auto; gap: 0.55rem; }

    .a-side {
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 1rem;
    }

    .a-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .a-stat { border: 1px solid var(--line); padding: 0.65rem; }
    .a-stat span { display: block; color: var(--muted); font-size: 0.875rem; text-transform: uppercase; }
    .a-stat strong { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 1.1rem; }

    /* Variant B — focus workspace */
    .variant-b {
      --bg: #ece9df;
      --surface: #f8f5eb;
      --ink: #1f2623;
      --muted: #66706a;
      --line: #aeb4ad;
      --accent: #2258dd;
      --accent-ink: #ffffff;
      --alert: #b13d2f;
      --focus: #2258dd;
      --code-key: #663dc4;
      --code-num: #a9481d;
      --code-comment: #75827a;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      padding: max(2.8rem, var(--safe)) var(--safe) calc(var(--switcher-height) + 2rem);
    }

    .b-shell {
      width: min(88rem, 100%);
      margin-inline: auto;
    }

    .b-header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding-block-end: 1.1rem;
      border-block-end: 1px solid var(--line);
    }

    .b-header h1 { margin: 0.25rem 0 0; font: 500 clamp(1.25rem, 3vw, 2.4rem)/1.1 Georgia, serif; }
    .b-clock { text-align: center; }
    .b-clock strong { display: block; font: 800 clamp(1.7rem, 4vw, 3rem)/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .b-team { text-align: end; }

    .b-progress {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-block: 1rem 2rem;
    }

    .b-step { display: grid; grid-template-columns: auto 1fr; gap: 0.55rem; align-items: center; color: var(--muted); }
    .b-step::before { content: ""; width: 0.75rem; height: 0.75rem; border: 1px solid currentColor; border-radius: 50%; }
    .b-step.active { color: var(--accent); font-weight: 800; }
    .b-step.active::before { background: var(--accent); box-shadow: inset 0 0 0 0.15rem var(--bg); }

    .b-focus-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(16rem, 0.36fr);
      gap: clamp(1rem, 4vw, 4rem);
    }

    .b-main h2 {
      max-width: 18ch;
      margin: 0 0 0.7rem;
      font: 500 clamp(2rem, 5vw, 4.8rem)/0.95 Georgia, serif;
      letter-spacing: -0.045em;
    }

    .b-main > p { max-width: 58ch; color: var(--muted); }
    .variant-b .code-block { margin-block: 1.5rem; border-block: 1px solid var(--line); border-radius: 0; background: transparent; padding-inline: 0; }

    .b-answer-area { max-width: 48rem; }
    .b-answer-area h3 { margin: 0 0 0.6rem; font-size: 0.95rem; }
    .b-action-row { display: flex; flex-wrap: wrap; gap: 0.55rem; margin-block-start: 0.75rem; }

    .b-aside {
      display: grid;
      align-content: start;
      gap: 0.7rem;
    }

    .b-aside details {
      border-block-start: 1px solid var(--line);
      padding-block: 0.8rem;
    }

    .b-aside summary { cursor: pointer; font-weight: 850; }
    .b-aside details p { color: var(--muted); font-size: 0.9rem; }

    .b-role-banner {
      border: 1px solid var(--ink);
      padding: 1rem;
    }

    .b-role-banner strong { display: block; margin-block: 0.25rem; font: 500 1.55rem/1.1 Georgia, serif; }
    .b-role-banner p { margin: 0; color: var(--muted); font-size: 0.875rem; }

    .b-cooldown { padding: 0.9rem; background: var(--ink); color: var(--bg); }

    /* Variant C — team board */
    .variant-c {
      --bg: #17130f;
      --surface: #201b16;
      --surface-2: #2a231c;
      --ink: #fff3df;
      --muted: #b9a995;
      --line: #5b4d3e;
      --accent: #ff7148;
      --accent-ink: #1b0c07;
      --secondary: #65e2d2;
      --alert: #ffca64;
      --focus: #65e2d2;
      --code-key: #65e2d2;
      --code-num: #ffca64;
      --code-comment: #9e8c79;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--ink);
      padding: max(2.4rem, var(--safe)) var(--safe) calc(var(--switcher-height) + 1.5rem);
    }

    .c-shell { width: min(100rem, 100%); margin-inline: auto; }

    .c-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      align-items: end;
      margin-block-end: 1rem;
    }

    .c-header h1 { margin: 0.15rem 0 0; font-size: clamp(1.5rem, 4vw, 3.5rem); letter-spacing: -0.045em; }
    .c-clock { text-align: end; }
    .c-clock strong { display: block; color: var(--secondary); font: 900 clamp(2rem, 5vw, 4rem)/0.85 ui-monospace, SFMono-Regular, Menlo, monospace; }

    .c-scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      border-block: 1px solid var(--line);
      padding-block: 0.8rem;
    }

    .c-scoreboard div { display: flex; align-items: center; gap: 0.65rem; }
    .c-scoreboard div:last-child { justify-content: end; }
    .c-scoreboard strong { font-size: 1.15rem; }
    .c-versus { color: var(--muted); font: 800 0.875rem/1 ui-monospace, SFMono-Regular, Menlo, monospace; }

    .c-board {
      display: grid;
      grid-template-columns: minmax(15rem, 0.72fr) minmax(25rem, 1.55fr);
      gap: 1rem;
      margin-block-start: 1rem;
    }

    .c-team-rail { display: grid; gap: 0.75rem; align-content: start; }
    .c-member {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 0.75rem;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 0.75rem;
    }

    .c-avatar {
      display: grid;
      place-items: center;
      width: 2.5rem;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--secondary);
      color: #08221f;
      font-weight: 900;
    }

    .c-member small { display: block; color: var(--muted); }
    .c-check { color: var(--secondary); font-weight: 900; }

    .c-private {
      border: 1px solid var(--accent);
      background: color-mix(in srgb, var(--accent) 9%, var(--surface));
      padding: 1rem;
    }

    .c-private strong { display: block; margin-block: 0.25rem 0.5rem; font-size: 1.15rem; }
    .c-private p { margin: 0; color: var(--muted); font-size: 0.875rem; }

    .c-mission {
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 0.85rem;
    }

    .c-mission-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 1rem;
      align-items: start;
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 1rem;
    }

    .c-mission-head h2 { margin: 0.2rem 0 0; font-size: clamp(1.4rem, 3vw, 2.5rem); }
    .c-stage-chip { border: 1px solid var(--accent); color: var(--accent); padding: 0.35rem 0.55rem; font-weight: 850; }

    .c-work-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(14rem, 0.65fr);
      gap: 0.85rem;
    }

    .variant-c .code-block { min-height: 18rem; border: 1px solid var(--line); background: #0f0c09; }
    .c-answer-panel { border: 1px solid var(--line); background: var(--surface); padding: 0.85rem; }
    .c-answer-panel .answer-list { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-block: 0.7rem; }
    .c-answer-panel .stack-actions { margin-block-start: 0.7rem; }

    .c-bottom {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(17rem, 0.5fr);
      gap: 0.85rem;
    }

    .c-chat,
    .c-events { border: 1px solid var(--line); background: var(--surface); padding: 0.85rem; }
    .c-chat h3, .c-events h3 { margin: 0 0 0.6rem; font-size: 0.9rem; }

    /* Dialogs */
    dialog {
      width: min(32rem, calc(100% - 2rem));
      border: 1px solid #8f948f;
      border-radius: 0.65rem;
      background: #f5f2e8;
      color: #1d2522;
      padding: 1.2rem;
    }

    dialog::backdrop { background: rgb(0 0 0 / 0.7); }
    dialog h2 { margin-block-start: 0; }
    dialog .dialog-actions { display: flex; justify-content: end; gap: 0.6rem; margin-block-start: 1rem; }
    dialog button { min-height: 2.8rem; border: 1px solid #303834; border-radius: 0.35rem; background: transparent; color: inherit; padding: 0.55rem 0.8rem; font-weight: 750; }
    dialog button[value="confirm"] { background: #1d2522; color: #ffffff; }
    #state-output { max-height: 24rem; overflow: auto; border: 1px solid #b6bbb6; padding: 0.7rem; font-size: 0.875rem; white-space: pre-wrap; }

    /* Prototype switcher */
    .prototype-switcher {
      position: static;
      display: grid;
      grid-template-columns: auto minmax(11rem, auto) auto auto;
      align-items: center;
      gap: 0.35rem;
      max-width: calc(100% - 1rem);
      margin: 3.5rem auto 0.75rem;
      border: 1px solid #626b67;
      border-radius: 99rem;
      background: #111614;
      color: #f5f7f3;
      box-shadow: 0 0.8rem 2.5rem rgb(0 0 0 / 0.35);
      padding: 0.35rem;
    }

    .prototype-switcher button {
      min-width: 2.75rem;
      min-height: 2.75rem;
      border: 0;
      border-radius: 99rem;
      background: transparent;
      color: inherit;
      font-weight: 850;
      text-align: center;
    }

    .prototype-switcher button:hover { background: #28312d; }
    .switcher-label { padding-inline: 0.5rem; text-align: center; }
    .switcher-label strong { display: block; font-size: 0.875rem; }
    .switcher-label small { color: #aeb9b3; font-size: 0.875rem; }
    .switcher-state { border-inline-start: 1px solid #4d5652 !important; border-radius: 0 99rem 99rem 0 !important; padding-inline: 0.85rem; font-size: 0.875rem; }

    @media (max-width: 70rem) {
      .a-grid { grid-template-columns: minmax(12rem, 0.65fr) minmax(25rem, 1.6fr); }
      .a-side { grid-column: 1 / -1; grid-template-columns: 0.6fr 1fr; border-block-start: 1px solid var(--line); }
      .a-side.a-pane { border-inline-start: 0; }
      .b-focus-grid { grid-template-columns: minmax(0, 1fr) minmax(14rem, 0.42fr); gap: 1.5rem; }
      .c-board { grid-template-columns: 1fr; }
      .c-team-rail { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .c-private { grid-column: 1 / -1; }
    }

    @media (max-width: 48rem) {
      :root { --switcher-height: 6.5rem; }
      .prototype-flag { inset-inline-start: var(--safe); translate: 0; }
      .a-topbar, .b-header { grid-template-columns: 1fr auto; }
      .a-opponent, .b-team { display: none; }
      .a-stagebar { overflow-x: auto; grid-template-columns: repeat(3, minmax(10rem, 1fr)); }
      .a-grid { grid-template-columns: 1fr; }
      .a-pane + .a-pane { border-inline-start: 0; border-block-start: 1px solid var(--line); }
      .a-side { grid-column: auto; grid-template-columns: 1fr; }
      .a-action-row { grid-template-columns: 1fr 1fr; }
      .a-action-row .primary { grid-column: 1 / -1; grid-row: 1; }
      .b-focus-grid, .c-work-grid, .c-bottom { grid-template-columns: 1fr; }
      .b-aside { grid-row: 1; }
      .b-main h2 { font-size: clamp(2rem, 11vw, 4rem); }
      .c-team-rail { grid-template-columns: 1fr; }
      .c-header { grid-template-columns: 1fr auto; }
      .c-scoreboard { grid-template-columns: 1fr 1fr; }
      .c-scoreboard .c-versus { display: none; }
      .answer-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .prototype-switcher { grid-template-columns: auto minmax(0, 1fr) auto auto; width: calc(100% - 1rem); }
      .switcher-label small { display: block; font-size: 0.75rem; }
      .switcher-state { grid-column: auto; border-inline-start: 1px solid #4d5652 !important; border-block-start: 0 !important; border-radius: 0 99rem 99rem 0 !important; padding-inline: 0.6rem; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .action-btn,
      .answer-btn,
      .prototype-switcher button { transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease, translate 120ms ease; }
      .action-btn:active,
      .answer-btn:active { translate: 0 0.08rem; }
    }

    @media (prefers-contrast: more) {
      :root { --focus: #ffffff; }
      .action-btn, .answer-btn, .a-grid, .c-member, .c-mission-head { border-width: 2px; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#game-ui">Skip to match</a>
  <div class="prototype-flag">UI prototype · fake state</div>
  <nav class="prototype-switcher" aria-label="Prototype variants">
    <button type="button" id="previous-variant" aria-label="Previous UI variant">←</button>
    <div class="switcher-label" aria-live="polite">
      <strong id="variant-name">A — Operations console</strong>
      <small id="selected-direction">Selected direction · Operations console</small>
    </div>
    <button type="button" id="next-variant" aria-label="Next UI variant">→</button>
    <button type="button" class="switcher-state" id="show-state">State</button>
  </nav>
  <main id="game-ui" tabindex="-1">
    <div id="app"></div>
  </main>
  <p class="visually-hidden sr-status" id="live-status" aria-live="polite" aria-atomic="true"></p>

  <dialog id="hint-dialog" aria-labelledby="hint-title">
    <form method="dialog">
      <p class="eyebrow">Team action</p>
      <h2 id="hint-title">Request hint 1?</h2>
      <p>A different teammate must confirm it. If accepted, the hint adds <strong>30 seconds</strong> to your finish delay.</p>
      <div class="dialog-actions">
        <button value="cancel">Cancel</button>
        <button value="confirm">Ask teammate</button>
      </div>
    </form>
  </dialog>

  <dialog id="state-dialog" aria-labelledby="state-title">
    <form method="dialog">
      <p class="eyebrow">Prototype inspector</p>
      <h2 id="state-title">Current fake match state</h2>
      <pre id="state-output" tabindex="0"><code></code></pre>
      <div class="dialog-actions">
        <button value="close">Close</button>
      </div>
    </form>
  </dialog>

  <script>
    "use strict";

    const variants = [
      { key: "A", name: "Operations console" },
      { key: "B", name: "Focus workspace" },
      { key: "C", name: "Team board" }
    ];

    const initialState = {
      stage: 1,
      totalStages: 3,
      remainingSeconds: 582,
      selectedAnswer: null,
      correctAnswer: "16",
      contributions: [
        { player: "Aimane", role: "Code reader", ready: true },
        { player: "Saad", role: "Answer builder", ready: false }
      ],
      sharedClue: false,
      hintsUsed: 0,
      finishDelay: 0,
      cooldown: 0,
      trace: null,
      lastEvent: "Match restored. Your private role is Code reader.",
      messages: [
        { author: "Saad", body: "I have the output slots. Send me the loop total." },
        { author: "System", body: "Stage 1 started. Both role contributions are required." }
      ]
    };

    function createStore(seed) {
      let state = structuredClone(seed);
      const subscribers = new Set();

      return {
        getState: () => state,
        update(mutator, eventText) {
          const next = structuredClone(state);
          mutator(next);
          if (eventText) next.lastEvent = eventText;
          state = next;
          subscribers.forEach((subscriber) => subscriber(state));
        },
        subscribe(subscriber) {
          subscribers.add(subscriber);
          return () => subscribers.delete(subscriber);
        }
      };
    }

    const store = createStore(initialState);
    const uiState = { chatOpen: false };
    const app = document.querySelector("#app");
    const liveStatus = document.querySelector("#live-status");
    const hintDialog = document.querySelector("#hint-dialog");
    const stateDialog = document.querySelector("#state-dialog");

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60).toString().padStart(2, "0");
      const rest = (seconds % 60).toString().padStart(2, "0");
      return `${minutes}:${rest}`;
    }

    function currentVariant() {
      const requested = new URLSearchParams(location.search).get("variant")?.toUpperCase();
      return variants.some((variant) => variant.key === requested) ? requested : "A";
    }

    function codeMarkup() {
      return `<span class="token-key">int</span> sum = <span class="token-num">0</span>;
<span class="token-key">for</span> (<span class="token-key">int</span> i = <span class="token-num">1</span>; i &lt;= <span class="token-num">4</span>; i++) {
    <span class="token-key">if</span> (i % <span class="token-num">2</span> == <span class="token-num">0</span>)
        sum += i * <span class="token-num">2</span>;
    <span class="token-key">else</span>
        sum += i;
}
<span class="token-comment">// What is the final value of sum?</span>`;
    }

    function answerButtons(state) {
      return ["12", "14", "16", "18"].map((answer) => `
        <button type="button" class="answer-btn" data-action="answer" data-value="${answer}" aria-pressed="${state.selectedAnswer === answer}">${answer}</button>
      `).join("");
    }

    function chatMarkup(state) {
      return `
        <ul class="chat-list" aria-label="Recent team messages">
          ${state.messages.slice(-4).map((message) => `
            <li class="chat-message"><strong>${escapeHtml(message.author)}</strong><span>${escapeHtml(message.body)}</span></li>
          `).join("")}
        </ul>
        <form class="chat-form" data-chat-form>
          <label class="visually-hidden" for="team-message">Team message</label>
          <input id="team-message" name="message" maxlength="120" placeholder="Message team…" autocomplete="off">
          <button type="submit" aria-label="Send team message">↗</button>
        </form>
      `;
    }

    function alertMarkup(state) {
      if (state.trace) return `<div class="match-alert"><strong>Failure trace:</strong> ${escapeHtml(state.trace)}</div>`;
      return `<div class="match-alert"><strong>Latest:</strong> ${escapeHtml(state.lastEvent)}</div>`;
    }

    function submitLabel(state) {
      if (state.cooldown > 0) return `Cooldown · ${state.cooldown}s`;
      return "Submit answer";
    }

    function renderVariantA(state) {
      return `
        <div class="variant-a">
          <div class="a-shell">
            <header class="a-topbar">
              <div><p class="eyebrow">Room 01 · Campus lockdown</p><h1>Restore the access controller</h1><a class="journey-link" href="journey.html">Journey map</a></div>
              <div class="a-timer"><span class="eyebrow">Match clock</span><strong class="num">${formatTime(state.remainingSeconds)}</strong></div>
              <div class="a-opponent"><p class="eyebrow">Race status</p><strong><span class="status-dot"></span>Blue 1 · Coral 0</strong></div>
            </header>

            <ol class="a-stagebar stage-list" aria-label="Room progress">
              <li class="a-stage active"><span class="a-stage-index">01</span><span><strong>Loop trace</strong><br><small>Active</small></span></li>
              <li class="a-stage"><span class="a-stage-index">02</span><span><strong>String map</strong><br><small>Locked</small></span></li>
              <li class="a-stage"><span class="a-stage-index">03</span><span><strong>Array repair</strong><br><small>Locked</small></span></li>
            </ol>

            <div class="a-grid">
              <aside class="a-pane" aria-labelledby="a-private-title">
                <p class="eyebrow">Private channel</p>
                <h2 id="a-private-title">Your role</h2>
                <div class="a-role-card">
                  <span class="eyebrow">Role 01</span>
                  <strong>Code reader</strong>
                  <p>Only you can see the source. Calculate the loop result, then share a safe clue or lock your contribution.</p>
                </div>
                <div class="a-clue"><small>Observed range</small><p><strong>i starts at 1</strong> and includes 4.</p></div>
                <div class="a-clue"><small>Branch rule</small><p>Even values are doubled before addition.</p></div>
                <div class="stack-actions">
                  <button type="button" class="action-btn" data-action="share-clue" ${state.sharedClue ? "disabled" : ""}>${state.sharedClue ? "Clue shared ✓" : "Share safe clue"}</button>
                  <button type="button" class="action-btn" data-action="contribute" data-player="0" ${state.contributions[0].ready ? "disabled" : ""}>Lock my contribution</button>
                </div>
              </aside>

              <section class="a-pane a-workspace" aria-labelledby="a-challenge-title">
                <div class="a-prompt"><p class="eyebrow">Stage 1 of 3 · Trace</p><h2 id="a-challenge-title">What value leaves the loop?</h2><p>Work with your teammate. Every role must contribute before the team can submit.</p></div>
                <pre class="code-block" tabindex="0"><code>${codeMarkup()}</code></pre>
                <div class="a-response">
                  ${alertMarkup(state)}
                  <div class="a-response-head"><div><p class="eyebrow">Team output</p><strong>Select one answer</strong></div><p>${state.contributions.filter((item) => item.ready).length}/2 roles locked</p></div>
                  <div class="answer-list">${answerButtons(state)}</div>
                  <div class="a-action-row">
                    <button type="button" class="action-btn" data-action="hint">Hint · +30s</button>
                    <button type="button" class="action-btn" data-action="contribute" data-player="1" ${state.contributions[1].ready ? "disabled" : ""}>${state.contributions[1].ready ? "Output locked ✓" : "Lock output"}</button>
                    <button type="button" class="action-btn primary" data-action="submit" ${state.cooldown > 0 ? "disabled" : ""}>${submitLabel(state)}</button>
                  </div>
                </div>
              </section>

              <aside class="a-pane a-side" aria-label="Team and race information">
                <div>
                  <p class="eyebrow">Team state</p><h2>Blue team</h2>
                  <div class="a-stat-grid">
                    <div class="a-stat"><span>Roles ready</span><strong>${state.contributions.filter((item) => item.ready).length}/2</strong></div>
                    <div class="a-stat"><span>Hints</span><strong>${state.hintsUsed}/2</strong></div>
                    <div class="a-stat"><span>Finish delay</span><strong>+${state.finishDelay}s</strong></div>
                    <div class="a-stat"><span>Cooldown</span><strong>${state.cooldown}s</strong></div>
                  </div>
                  ${state.cooldown ? `<button type="button" class="action-btn" data-action="advance-cooldown">Advance cooldown</button>` : ""}
                </div>
                <div>
                  <p class="eyebrow">Team chat</p><h2>Secure channel</h2>
                  ${chatMarkup(state)}
                </div>
              </aside>
            </div>
          </div>
        </div>
      `;
    }

    function renderVariantB(state) {
      return `
        <div class="variant-b">
          <div class="b-shell">
            <header class="b-header">
              <div><p class="eyebrow">Campus lockdown · Room 01</p><h1>Loop trace</h1></div>
              <div class="b-clock"><span class="eyebrow">Time left</span><strong class="num">${formatTime(state.remainingSeconds)}</strong></div>
              <div class="b-team"><p class="eyebrow">Blue team</p><strong>Stage 1 of 3</strong></div>
            </header>

            <ol class="b-progress stage-list" aria-label="Room progress">
              <li class="b-step active">Trace the loop</li>
              <li class="b-step">Map the string</li>
              <li class="b-step">Repair the array</li>
            </ol>

            <div class="b-focus-grid">
              <section class="b-main" aria-labelledby="b-challenge-title">
                <p class="eyebrow">Your current problem</p>
                <h2 id="b-challenge-title">Find the final value of <span class="mono">sum</span>.</h2>
                <p>You hold the code. Saad holds the answer builder. Share what matters, then both of you lock your contribution.</p>
                <pre class="code-block" tabindex="0"><code>${codeMarkup()}</code></pre>
                <div class="b-answer-area">
                  ${alertMarkup(state)}
                  <h3>Choose the team answer</h3>
                  <div class="answer-list">${answerButtons(state)}</div>
                  <div class="b-action-row">
                    <button type="button" class="action-btn primary" data-action="submit" ${state.cooldown > 0 ? "disabled" : ""}>${submitLabel(state)}</button>
                    <button type="button" class="action-btn" data-action="contribute" data-player="1" ${state.contributions[1].ready ? "disabled" : ""}>${state.contributions[1].ready ? "Output locked ✓" : "Lock output"}</button>
                    <button type="button" class="action-btn" data-action="hint">Request hint · +30s</button>
                    ${state.cooldown ? `<button type="button" class="action-btn" data-action="advance-cooldown">Advance 15s</button>` : ""}
                  </div>
                </div>
              </section>

              <aside class="b-aside" aria-label="Supporting match information">
                <div class="b-role-banner">
                  <p class="eyebrow">Private role</p><strong>Code reader</strong>
                  <p>Even values are doubled. The loop includes 4.</p>
                  <button type="button" class="action-btn" data-action="share-clue" ${state.sharedClue ? "disabled" : ""}>${state.sharedClue ? "Shared ✓" : "Share clue"}</button>
                </div>
                ${state.cooldown ? `<div class="b-cooldown"><p class="eyebrow">Retry blocked</p><strong>${state.cooldown} seconds remaining</strong></div>` : ""}
                <details open>
                  <summary>Role readiness · ${state.contributions.filter((item) => item.ready).length}/2</summary>
                  <p>${state.contributions.map((item) => `${item.player}: ${item.ready ? "locked" : "waiting"}`).join(" · ")}</p>
                </details>
                <details data-panel="chat" ${uiState.chatOpen ? "open" : ""}>
                  <summary>Team chat · ${state.messages.length}</summary>
                  ${chatMarkup(state)}
                </details>
                <details>
                  <summary>Race penalties</summary>
                  <p>${state.hintsUsed} hints used · +${state.finishDelay}s finish delay · ${state.cooldown}s retry cooldown.</p>
                </details>
              </aside>
            </div>
          </div>
        </div>
      `;
    }

    function renderVariantC(state) {
      const readyCount = state.contributions.filter((item) => item.ready).length;
      return `
        <div class="variant-c">
          <div class="c-shell">
            <header class="c-header">
              <div><p class="eyebrow">Competitive co-op · Room 01</p><h1>Campus access controller</h1></div>
              <div class="c-clock"><span class="eyebrow">Time left</span><strong class="num">${formatTime(state.remainingSeconds)}</strong></div>
            </header>

            <div class="c-scoreboard" aria-label="Race score">
              <div><span class="status-dot"></span><strong>Blue team</strong><span>Stage 1</span></div>
              <span class="c-versus">LIVE RACE</span>
              <div><span>Lobby trace</span><strong>Coral team</strong><span class="status-dot"></span></div>
            </div>

            <div class="c-board">
              <aside class="c-team-rail" aria-label="Blue team roles">
                ${state.contributions.map((item, index) => `
                  <article class="c-member">
                    <span class="c-avatar" aria-hidden="true">${item.player.charAt(0)}</span>
                    <div><strong>${item.player}</strong><small>${item.role}</small></div>
                    <span class="c-check">${item.ready ? "Ready ✓" : "Waiting"}</span>
                  </article>
                `).join("")}
                <div class="c-private">
                  <p class="eyebrow">Only you can see this</p>
                  <strong>Your private clue</strong>
                  <p>The loop includes 4. Even values are doubled before adding.</p>
                  <button type="button" class="action-btn" data-action="share-clue" ${state.sharedClue ? "disabled" : ""}>${state.sharedClue ? "Clue shared ✓" : "Share a safe clue"}</button>
                </div>
              </aside>

              <section class="c-mission" aria-labelledby="c-challenge-title">
                <header class="c-mission-head">
                  <div><p class="eyebrow">Current mission</p><h2 id="c-challenge-title">Trace the loop and assemble the output</h2></div>
                  <span class="c-stage-chip">1 / 3</span>
                </header>
                <div class="c-work-grid">
                  <pre class="code-block" tabindex="0"><code>${codeMarkup()}</code></pre>
                  <div class="c-answer-panel">
                    <p class="eyebrow">Team answer</p>
                    <strong>${readyCount}/2 role contributions locked</strong>
                    <div class="progress-track" aria-hidden="true"><div class="progress-fill" style="--progress: ${readyCount * 50}%"></div></div>
                    <div class="answer-list">${answerButtons(state)}</div>
                    ${alertMarkup(state)}
                    <div class="stack-actions">
                      <button type="button" class="action-btn" data-action="contribute" data-player="1" ${state.contributions[1].ready ? "disabled" : ""}>${state.contributions[1].ready ? "Output locked ✓" : "Lock output contribution"}</button>
                      <button type="button" class="action-btn primary" data-action="submit" ${state.cooldown > 0 ? "disabled" : ""}>${submitLabel(state)}</button>
                      <button type="button" class="action-btn" data-action="hint">Hint · +30 seconds</button>
                      ${state.cooldown ? `<button type="button" class="action-btn" data-action="advance-cooldown">Advance cooldown</button>` : ""}
                    </div>
                  </div>
                </div>
                <div class="c-bottom">
                  <div class="c-chat"><h3>Team channel</h3>${chatMarkup(state)}</div>
                  <div class="c-events"><h3>Match state</h3><p>${escapeHtml(state.lastEvent)}</p><p><strong>Hints:</strong> ${state.hintsUsed}/2<br><strong>Finish delay:</strong> +${state.finishDelay}s<br><strong>Retry:</strong> ${state.cooldown ? `${state.cooldown}s` : "Ready"}</p></div>
                </div>
              </section>
            </div>
          </div>
        </div>
      `;
    }

    const renderers = { A: renderVariantA, B: renderVariantB, C: renderVariantC };

    function render(state) {
      const variant = currentVariant();
      app.innerHTML = renderers[variant](state);
      const meta = variants.find((item) => item.key === variant);
      document.querySelector("#variant-name").textContent = `${meta.key} — ${meta.name}`;
      document.querySelector("#selected-direction").textContent = variant === "A"
        ? "Selected direction · Operations console"
        : "Historical alternative · Use ← → when not typing";
      document.title = `${meta.name} | Campus Puzzle Race UI Prototype`;
      document.querySelector("#state-output code").textContent = JSON.stringify(state, null, 2);
      liveStatus.textContent = state.lastEvent;
    }

    function setVariant(key) {
      const params = new URLSearchParams(location.search);
      params.set("variant", key);
      history.replaceState(null, "", `${location.pathname}?${params.toString()}`);
      render(store.getState());
    }

    function cycleVariant(direction) {
      const index = variants.findIndex((variant) => variant.key === currentVariant());
      const nextIndex = (index + direction + variants.length) % variants.length;
      setVariant(variants[nextIndex].key);
    }

    function handleAction(action, element) {
      if (action === "answer") {
        store.update((state) => { state.selectedAnswer = element.dataset.value; }, `Team answer selected: ${element.dataset.value}.`);
        return;
      }

      if (action === "share-clue") {
        store.update((state) => {
          state.sharedClue = true;
          state.messages.push({ author: "Aimane", body: "Safe clue: even values are doubled; the loop includes 4." });
        }, "A safe clue was shared with the team.");
        return;
      }

      if (action === "contribute") {
        const index = Number(element.dataset.player);
        store.update((state) => { state.contributions[index].ready = true; }, `${store.getState().contributions[index].player} locked the ${store.getState().contributions[index].role} contribution.`);
        return;
      }

      if (action === "hint") {
        hintDialog.showModal();
        return;
      }

      if (action === "advance-cooldown") {
        store.update((state) => {
          state.remainingSeconds = Math.max(0, state.remainingSeconds - state.cooldown);
          state.cooldown = 0;
        }, "Retry cooldown cleared; the match clock kept running.");
        return;
      }

      if (action === "submit") {
        const state = store.getState();
        if (!state.contributions.every((item) => item.ready)) {
          store.update(() => {}, "Submission blocked: every role must lock a contribution.");
          return;
        }
        if (!state.selectedAnswer) {
          store.update(() => {}, "Submission blocked: select an answer first.");
          return;
        }
        if (state.selectedAnswer !== state.correctAnswer) {
          store.update((next) => {
            next.cooldown = 15;
            next.trace = "The result diverges after i = 2. Recheck the even branch.";
          }, "Wrong answer. A failure trace was returned and retry is blocked for 15 seconds.");
          return;
        }
        store.update((next) => {
          next.stage = 2;
          next.trace = null;
          next.selectedAnswer = null;
          next.contributions.forEach((item) => { item.ready = false; });
        }, "Stage 1 passed. String / character reasoning unlocked.");
      }
    }

    app.addEventListener("click", (event) => {
      const trigger = event.target.closest("[data-action]");
      if (!trigger) return;
      handleAction(trigger.dataset.action, trigger);
    });

    app.addEventListener("submit", (event) => {
      const form = event.target.closest("[data-chat-form]");
      if (!form) return;
      event.preventDefault();
      const input = form.elements.message;
      const message = input.value.trim();
      if (!message) return;
      store.update((state) => { state.messages.push({ author: "You", body: message }); }, "Team message sent.");
    });

    app.addEventListener("toggle", (event) => {
      if (event.target.matches('details[data-panel="chat"]')) {
        uiState.chatOpen = event.target.open;
      }
    }, true);

    hintDialog.addEventListener("close", () => {
      if (hintDialog.returnValue !== "confirm") return;
      store.update((state) => {
        state.hintsUsed += 1;
        state.finishDelay += 30;
        state.messages.push({ author: "System", body: "Hint request waiting for Saad's confirmation." });
      }, "Hint requested. Another teammate must confirm; accepting it adds 30 seconds of finish delay.");
    });

    document.querySelector("#previous-variant").addEventListener("click", () => cycleVariant(-1));
    document.querySelector("#next-variant").addEventListener("click", () => cycleVariant(1));
    document.querySelector("#show-state").addEventListener("click", () => stateDialog.showModal());

    addEventListener("keydown", (event) => {
      const target = event.target;
      if (target.matches("input, textarea, [contenteditable='true']")) return;
      if (event.key === "ArrowLeft") cycleVariant(-1);
      if (event.key === "ArrowRight") cycleVariant(1);
    });

    addEventListener("popstate", () => render(store.getState()));
    store.subscribe(render);
    render(store.getState());
  </script>
</body>
</html>
